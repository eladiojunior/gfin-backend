quarkus.http.port=8080

# MongoDB; sobrescreva via QUARKUS_MONGODB_CONNECTION_STRING e QUARKUS_MONGODB_DATABASE.
quarkus.mongodb.connection-string=mongodb://192.168.1.21:27017
quarkus.mongodb.credentials.username=user_gfin_app
quarkus.mongodb.credentials.password=2026_user_gfin
quarkus.mongodb.database=db_gfin

# Config JWT - SmallRye JWT
# Emissor do token (deve ser igual ao mp.jwt.verify.issuer nos consumers)
mp.jwt.verify.issuer=gfin-backend
# Chave privada RSA para assinar tokens (gerada em formato PEM PKCS8)
# IMPORTANTE: Substitua por uma chave RSA real gerada com: openssl genrsa -out private.pem 2048
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
# Chave publica para verificar tokens
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
# Expiracao do token em segundos (1 hora = 3600)
gfin.jwt.expiration.seconds=3600
gfin.processamento.fuso=America/Sao_Paulo
gfin.processamento.intervalo=5m

# Testes devem apontar para uma instância e banco isolados.
%test.quarkus.mongodb.database=gfin_test
quarkus.devservices.enabled=false

# O processamento agendado nao deve acessar o banco durante testes.
%test.quarkus.scheduler.enabled=false
